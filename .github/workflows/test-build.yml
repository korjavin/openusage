name: Test Build

# Unsigned (ad-hoc) OpenUsage.app for manual testing — no Apple secrets needed.
# Run: gh workflow run test-build.yml -R korjavin/openusage -f ref=<branch>
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/SHA to build"
        default: main
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # swift-tools-version 6.2 needs Xcode 26; macos-15 defaults to Xcode 16, so pick the newest 26.x.
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" && xcodebuild -version
      - run: script/build_and_run.sh build
      - run: ditto -c -k --keepParent dist/OpenUsage.app OpenUsage.zip
      # archive: false uploads the ditto zip as-is (symlinks/exec bits intact) instead of zipping it again.
      - uses: actions/upload-artifact@v7
        with:
          path: OpenUsage.zip
          archive: false
